<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatNodeRev {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      .bg-glow {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 8;
        animation: dashFlow 4s linear infinite;
      }
      .node-1 { animation: floatNode 5s ease-in-out infinite; }
      .node-2 { animation: floatNodeRev 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Glowing Background Shapes -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad)" class="bg-glow"/>
  <circle cx="1000" cy="300" r="220" fill="url(#glowGrad)" class="bg-glow" style="animation-delay: -3s;"/>

  <!-- Grid Pattern Background overlay -->
  <g opacity="0.15">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200" stroke="#38bdf8" stroke-width="1"/>
    <path d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400 M600,0 V400 M700,0 V400 M800,0 V400 M900,0 V400 M1000,0 V400 M1100,0 V400" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Dynamic Flow Connections behind text -->
  <g opacity="0.4">
    <path d="M 150 320 Q 350 380 600 320 T 1050 320" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line"/>
    <path d="M 100 80 Q 400 20 700 80 T 1100 80" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line"/>
  </g>

  <!-- Decorative Connected Worker / SOP Nodes (Background Elements) -->
  <g class="node-1" opacity="0.3">
    <rect x="80" y="280" width="130" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="145" y="315" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">📋 Visual SOPs</text>
  </g>

  <g class="node-2" opacity="0.3">
    <rect x="990" y="60" width="140" height="60" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="1060" y="95" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">⚙️ Shop Floor MES</text>
  </g>

  <!-- Foreground Title Card Overlay for Maximum Contrast & Readability -->
  <rect x="150" y="90" width="900" height="220" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" style="backdrop-filter: blur(10px);"/>

  <!-- Foreground Content (Always crisp & legible above animations) -->
  <g text-anchor="middle">
    <!-- Icon / Badge -->
    <g transform="translate(600, 135)">
      <rect x="-70" y="-18" width="140" height="32" rx="16" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
      <text x="0" y="3" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="200" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Digital Work Instructions
    </text>

    <!-- Subtitle -->
    <text x="600" y="245" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      Curated Visual SOPs, Connected Worker Platforms &amp; Manufacturing Guidance
    </text>

    <!-- Feature Pills -->
    <g transform="translate(600, 280)">
      <text x="-220" y="0" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">⚡ Interactive SOPs</text>
      <text x="-70" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">•</text>
      <text x="-40" y="0" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">🏭 Connected Worker</text>
      <text x="105" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">•</text>
      <text x="135" y="0" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="500">🛠️ Open-Source MES</text>
    </g>
  </g>
</svg>
